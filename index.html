<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        padding-bottom: 50px; 
      }

      .footer {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        background-color: rgb(9, 84, 91);
        color: white;
        text-align: center;
        padding: 10px 0;
        z-index: 1000;
      }

      .hero-section {
        background: url('https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/affba656-d015-4b96-a8ba-3ef5bbbc2c39/OBMC+MONTESSORI+GH+-+AY+2026+FA.jpg') no-repeat center center / cover;
        min-height: calc(100vh - 120px);
        padding: 40px 0;
      }

      .card-custom {
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpZJc41KxHTCtiacsXkLOzS_QO9tMggilUH9PPeXFahg&s=10" alt="OBMC LOGO" class="rounded-circle" style="height: 60px; width: 60px;"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="#">Enroll Now</a></li>
      </ul>
      </div>

      <form class="d-flex">
        <input class="form-control me-2" type="text" placeholder="Search">
        <button class="btn btn-primary" type="button">My Portal</button>
      </form>
    </div>
  </div>
</nav>

<div class="hero-section">
    <div class="container">
      
      <div class="text-center text-white mb-4">
            <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpZJc41KxHTCtiacsXkLOzS_QO9tMggilUH9PPeXFahg&s=10" alt="Logo" class="rounded-circle" style="height: 50px; width: 50px;">
                <h1 class="fw-bold mb-0">OBMC Student Enrollment Form</h1>
            </div>
            <p class="small text-light opacity-75">Fill out the form below to enroll for the upcoming academic year.</p>
        </div>

       <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card card-custom p-4 p-md-5">
                    <form>

                    <h5 class="fw-bold text-dark mb-3">Student Information</h5>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small mb-1">First Name</label>
                                <input type="text" class="form-control" placeholder="Ex. John" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small mb-1">Last Name</label>
                                <input type="text" class="form-control" placeholder="Ex. Doe" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label text-muted small mb-1">Birth Date</label>
                                <input type="date" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small mb-1">Gender</label>
                                <select class="form-select" required>
                                    <option selected disabled>Select...</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small mb-1">Grade Level</label>
                                <select class="form-select" required>
                                    <option selected disabled>Select...</option>
                                    <option value="7">Grade 7</option>
                                    <option value="8">Grade 8</option>
                                    <option value="9">Grade 9</option>
                                    <option value="10">Grade 10</option>
                                    <option value="10">Grade 11</option>
                                    <option value="10">Grade 12</option>
                                </select>
                            </div>
                        </div>
                        
                        <h5 class="fw-bold text-dark mb-3">Contact Details</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted small mb-1">Email Address</label>
                            <input type="email" class="form-control" placeholder="student@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small mb-1">Contact Number</label>
                            <input type="tel" class="form-control" placeholder="0912-345-6789" required>
                        </div>
                        <h5 class="fw-bold text-dark mb-2">Other Information</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted small d-block mb-1">Mode of Learning</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="learningMode" id="online" value="online">
                                <label class="form-check-label small" for="online">Online</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="learningMode" id="faceToFace" value="facetoface" checked>
                                <label class="form-check-label small" for="faceToFace">Face-to-Face</label>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="confirmation" required>
                            <label class="form-check-label small text-muted" for="confirmation">
                                I confirm that the information provided is true and complete.
                            </label>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary px-5 py-2">Submit Enrollment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<footer class="footer">
  <p class="mb-0">© OBMC Montessori Center</p>
</footer>

</body>
</html>
